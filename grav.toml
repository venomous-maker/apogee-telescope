name = "apogee-telescope"
lib = "src/all.grav"
grav = ">=1.12.0"
paths = ["src"]

[dependencies]
apogee-package = "github.com/venomous-maker/apogee-package@v0.1.0"
apogee-config = "github.com/venomous-maker/apogee-config@v0.2.0"
apogee-console = "github.com/venomous-maker/apogee-console@v0.2.2"
apogee-container = "github.com/venomous-maker/apogee-container@v0.2.0"
apogee-events = "github.com/venomous-maker/apogee-events@v0.2.0"
